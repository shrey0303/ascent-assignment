# Render blueprint: New > Blueprint > pick this repo. Render builds the Dockerfile and sets PORT itself.
# The two API keys are asked for when the blueprint is created (sync: false); they are never stored in git.
services:
  - type: web
    name: parcelpilot-support
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true   # random, so signed logins and confirmations can't be forged
      - key: DEMO_PASSWORD
        value: demo123        # the public test logins from the README
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_REASONING_EFFORT
        value: low
      - key: LLM_PRICE_IN_PER_M
        value: "0.15"
      - key: LLM_PRICE_OUT_PER_M
        value: "0.60"
      - key: LLM_MAX_OUTPUT_TOKENS
        value: "8192"
      - key: INJECTION_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_API_KEY
        sync: false           # OpenRouter key
      - key: INJECTION_API_KEY
        sync: false           # Groq key
